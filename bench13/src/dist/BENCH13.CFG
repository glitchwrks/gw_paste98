# pastebench13 options. Whitespace-separated, '#' starts a comment. Read via
# "@BENCH13.CFG" (avoids COMMAND.COM's 127-character command line limit).

--host pastes.glitchwrks.com
--port 443

# SHA-256 pin of the server's key: the same value as in the paste client's
# Settings (Server > Key pins) or the Java 5 pastebench's BENCH.CFG. Required.
--pin REPLACE_WITH_LIVE_KEY_PIN

# Optional: also fetch a page over each connection. A 404 still times the round trip.
#--get /abcd1234

--full 3
--resume 3

# Experiments (defaults shown):
#--cipher auto        # auto | chacha | aes128 | aes256
#--group auto         # auto | x25519 | p256
#--budget 2000        # milliseconds per offline crypto test
