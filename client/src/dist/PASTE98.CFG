# gw_paste98 settings. Edit with Notepad, then restart gw_paste98.

# The pastes server.
host=pastes.glitchwrks.com
port=443

# SHA-256 hash of the server's public key, in base64 (the "SPKI pin").
# The client only talks to a server holding this exact key; it does not use
# Java's certificate authorities. Put a backup key's pin after the first one,
# separated by a space. README.TXT explains how to get the pin.
pins=REPLACE_WITH_LIVE_KEY_PIN

# Optional: prefer a cipher. auto, chacha, aes128 or aes256.
#cipher=auto
