# pastebench options. Whitespace-separated, '#' starts a comment.
# Read by BENCH.BAT and SHOWPIN.BAT via "@BENCH.CFG" (avoids command.com's
# 127-character command line limit).

--host pastes.glitchwrks.com
--port 443

# SHA-256 SPKI pin of the server's key. See README.md for how to compute it
# from the private key on the server. Required for BENCH.BAT.
--pin REPLACE_WITH_LIVE_KEY_PIN

# Optional second pin for an offline backup key.
#--pin REPLACE_WITH_BACKUP_KEY_PIN

# Optional: fetch a paste over each connection to time a full request.
# Any path works; a 404 still measures the round trip.
#--get /abcd1234

--full 3
--resume 3

# Cipher / group / version experiments (defaults shown):
#--cipher auto        # auto | chacha | aes128 | aes256
#--group auto         # auto | x25519 | p256
#--tls13              # also offer TLS 1.3 (BC's TLS 1.3 client does not resume sessions)
